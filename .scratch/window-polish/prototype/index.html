<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窗口打磨 · 交互原型</title>
<style>
/* ============================================================================
 * 窗口打磨原型 —— 这一页只做一件事：把"观感"和"两个右键入口"变成能点的东西。
 * 里面的尺寸就是在投票：字号阶、行高、把手范围，定了就照它落到真代码里。
 * 整页自包含，不引外部依赖。
 * ==========================================================================*/

/* ---- roles: dark 是默认皮肤，浅色在下方 [[data-theme="light"]] 里换掉 ---- */
:root{
	--bg-base: rgb(21,21,23);
	--bg-sidebar: rgb(27,27,28);
	--bg-layer-1: rgb(35,35,36);
	--bg-layer-2: rgb(44,44,46);
	--bg-hover: rgba(255,255,255,.08);
	--bg-active: rgba(255,255,255,.14);
	--border-l1: rgba(255,255,255,.06);
	--border-l2: rgba(255,255,255,.12);
	--border-l3: rgba(255,255,255,.18);
	--fg-primary: rgb(249,250,251);
	--fg-secondary: rgb(207,211,214);
	--fg-tertiary: rgb(173,178,184);
	--fg-caption: rgb(129,133,140);
	--accent: rgb(122,170,255);
	--accent-tint: rgba(122,170,255,.14);
	--bubble: rgb(44,44,46);
	--code-bg: rgb(27,27,28);
	--warn: rgb(245,158,11);
	--code: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, Courier, "PingFang SC", "Microsoft YaHei";
	--sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
html[data-theme="light"]{
	--bg-base: rgb(255,255,255);
	--bg-sidebar: rgb(249,250,251);
	--bg-layer-1: rgb(255,255,255);
	--bg-layer-2: rgb(241,243,245);
	--bg-hover: rgba(38,49,72,.06);
	--bg-active: rgba(38,49,72,.1);
	--border-l1: rgba(0,0,0,.05);
	--border-l2: rgba(0,0,0,.1);
	--border-l3: rgba(0,0,0,.16);
	--fg-primary: rgb(15,17,21);
	--fg-secondary: rgb(97,102,107);
	--fg-tertiary: rgb(129,133,140);
	--fg-caption: rgb(173,178,184);
	--accent: rgb(65,118,230);
	--accent-tint: rgba(65,118,230,.1);
	--bubble: rgb(237,243,254);
	--code-bg: rgb(249,250,251);
	--warn: rgb(221,134,41);
}

/* ---- 字号阶：原型投的三档（04 号票要拍的就是这个） ---- */
:root{
	--fs-body: 15px;   --lh-body: 25px;
	--fs-title: 14px;  --lh-title: 20px;
	--fs-meta: 13px;   --lh-meta: 18px;
	--fs-caption: 12px;--lh-caption: 16px;
	--fs-code: 13px;   --lh-code: 20px;
	--r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
	--ease: cubic-bezier(.4,0,.2,1);
	/* 两个把手 */
	--sidebar-w: 264px;
	/* 正文列宽：这个只是首帧的兜底，真正的值由脚本按会话列宽算（见 autoReadingWidth）。 */
	--reading-w: 770px;
}

*{ box-sizing: border-box; }
[hidden]{ display: none !important; }
html,body{ height:100%; }
body{
	margin:0; font-family: var(--sans); font-size: var(--fs-body); line-height: var(--lh-body);
	color: var(--fg-primary); background: rgb(10,10,11); overflow:hidden;
	-webkit-font-smoothing: antialiased;
}
html[data-theme="light"] body{ background: rgb(232,234,238); }
button{ font: inherit; color: inherit; background:none; border:none; padding:0; cursor:pointer; }
svg{ display:block; }
::selection{ background: var(--accent-tint); }

/* ============================ 原型外壳 ============================ */
.stage{ height:100%; display:flex; flex-direction:column; }
.proto-bar{
	flex:none; display:flex; align-items:center; gap:14px; padding:10px 16px;
	background: rgb(15,15,16); border-bottom:1px solid rgba(255,255,255,.08);
	color: rgb(207,211,214); font-size: var(--fs-meta);
}
html[data-theme="light"] .proto-bar{ background: rgb(244,245,247); border-bottom-color: rgba(0,0,0,.08); color: rgb(70,74,80); }
.proto-title{ font-weight:600; color: var(--fg-primary); }
html[data-theme="light"] .proto-bar .proto-title{ color: rgb(15,17,21); }
.seg{ display:flex; gap:2px; padding:2px; border-radius: var(--r-sm); background: rgba(255,255,255,.06); }
html[data-theme="light"] .seg{ background: rgba(0,0,0,.05); }
.seg button{ padding:4px 12px; border-radius:6px; color: inherit; transition: background .15s var(--ease), color .15s var(--ease); }
.seg button[aria-selected="true"]{ background: var(--bg-layer-2); color: var(--fg-primary); }
html[data-theme="light"] .seg button[aria-selected="true"]{ background:#fff; color: rgb(15,17,21); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.proto-bar .spacer{ flex:1; }
.toggle{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius: var(--r-sm); border:1px solid rgba(255,255,255,.14); }
html[data-theme="light"] .toggle{ border-color: rgba(0,0,0,.12); }
.toggle:hover{ background: rgba(255,255,255,.06); }
html[data-theme="light"] .toggle:hover{ background: rgba(0,0,0,.04); }
.toggle[aria-pressed="true"]{ border-color: var(--accent); color: var(--accent); }

.workarea{ flex:1; min-height:0; display:flex; gap:16px; padding:16px; }
.stage-wrap{ flex:1; min-width:0; display:flex; }
.frame{
	flex:1; min-width:0; display:flex; overflow:hidden; position:relative;
	background: var(--bg-base); border-radius: var(--r-lg);
	border:1px solid rgba(255,255,255,.1); box-shadow: 0 18px 50px rgba(0,0,0,.5);
}
html[data-theme="light"] .frame{ border-color: rgba(0,0,0,.1); box-shadow: 0 18px 50px rgba(0,0,0,.16); }

/* ---- 目录（右侧标注面板） ---- */
.legend{
	flex:none; width:280px; overflow-y:auto; padding:14px 16px; border-radius: var(--r-lg);
	background: var(--bg-sidebar); border:1px solid rgba(255,255,255,.08);
	font-size: var(--fs-meta); line-height: var(--lh-meta);
}
html[data-theme="light"] .legend{ border-color: rgba(0,0,0,.08); }
.legend h4{ margin:0 0 10px; font-size: var(--fs-title); line-height: var(--lh-title); font-weight:600; }
.legend ol{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
.legend li{ display:flex; gap:8px; color: var(--fg-secondary); }
.legend li b{ flex:none; width:16px; height:16px; margin-top:1px; border-radius:50%; background: var(--accent); color:#fff;
	font-size:10px; line-height:16px; text-align:center; font-family: var(--code); }
.legend .try{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border-l1); color: var(--fg-tertiary); }
.legend .try p{ margin:0 0 8px; }
.legend kbd{ font-family: var(--code); font-size:var(--fs-caption); padding:1px 5px; border-radius:var(--r-xs);
	border:1px solid var(--border-l2); background: var(--bg-layer-1); color: var(--fg-secondary); }

/* 标注气泡：聚焦某一列时另一列的标注收起，免得多话。整窗视图两列都显。 */
.callout{
	position:absolute; z-index:20; display:none; align-items:center; justify-content:center;
	width:20px; height:20px; border-radius:50%; background: var(--accent); color:#fff;
	font-size:11px; font-family: var(--code); font-weight:600; box-shadow: 0 2px 8px rgba(0,0,0,.4);
	pointer-events:none;
}
body[data-annots="on"]:not([data-view="conv"]):not([data-view="branch"]) .side-col .callout,
body[data-annots="on"]:not([data-view="sidebar"]) .main-col .callout{ display:flex; }

/* 未聚焦的那一列退到后面去 */
body[data-view="sidebar"] .main-col{ opacity:.34; pointer-events:none; filter:saturate(.5); }
body[data-view="conv"] .side-col,
body[data-view="branch"] .side-col{ opacity:.34; pointer-events:none; filter:saturate(.5); }
.side-col, .main-col{ transition: opacity .2s var(--ease), filter .2s var(--ease); }

/* ============================ 左栏 ============================ */
.side-col{
	flex:none; width: var(--sidebar-w); display:flex; flex-direction:column;
	background: var(--bg-sidebar); border-right:1px solid var(--border-l1); position:relative; min-width:0;
}
.side-top{ flex:none; display:flex; align-items:center; gap:6px; padding:12px 12px 8px; }
.new-session{
	flex:1; display:flex; align-items:center; justify-content:center; gap:8px; height:34px;
	border-radius: var(--r-md); background: var(--bg-layer-2); color: var(--fg-primary);
	font-size: var(--fs-title); line-height: var(--lh-title); transition: background .15s var(--ease);
}
.new-session:hover{ background: var(--bg-hover-solid, rgb(53,54,56)); }
html[data-theme="light"] .new-session{ background: rgb(235,238,242); }
html[data-theme="light"] .new-session:hover{ background: rgb(225,229,238); }
.icon-btn{
	flex:none; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;
	border-radius: var(--r-sm); color: var(--fg-tertiary); transition: background .15s var(--ease), color .15s var(--ease);
}
.icon-btn:hover{ background: var(--bg-hover); color: var(--fg-primary); }

.list-head{ flex:none; display:flex; align-items:center; gap:6px; padding:10px 16px 6px; }
.list-head h5{ margin:0; font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight:600;
	letter-spacing:.04em; color: var(--fg-caption); }
.list-head .spacer{ flex:1; }
.list-head .icon-btn{ width:24px; height:24px; }

.side-list{ flex:1; overflow-y:auto; padding:0 8px 12px; }
.ws{ margin-bottom:2px; }
.ws-head{
	display:flex; align-items:center; gap:7px; height:34px; padding:0 8px; border-radius: var(--r-md);
	cursor:pointer; color: var(--fg-tertiary); font-size: var(--fs-meta); line-height: var(--lh-meta);
}
.ws-head:hover{ background: var(--bg-hover); }
.ws-head .ws-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ws-head .chev{ display:none; }
.ws-head:hover .chev{ display:block; }
.ws-head:hover .folder{ display:none; }
.ws-mark{ flex:none; font-size:11px; line-height:16px; padding:0 6px; border-radius:999px;
	background: var(--accent-tint); color: var(--accent); }

.srow{
	display:flex; align-items:center; gap:0; width:100%; height:32px; padding:0 8px;
	padding-inline-start: calc(8px + var(--indent, 0px));
	border-radius: var(--r-md); color: var(--fg-secondary); text-align:left;
	transition: background .12s var(--ease), color .12s var(--ease);
}
.srow:hover{ background: var(--bg-hover); color: var(--fg-primary); }
.srow[aria-current="true"]{ background: var(--bg-active); color: var(--fg-primary); }
.srow .slot{ flex:none; width:16px; height:20px; display:inline-flex; align-items:center; justify-content:center; color: var(--fg-caption); }
.srow .slot .spinner{ width:8px; height:8px; border-radius:50%; background: var(--warn); }
.srow .title{ flex:1; min-width:0; margin:0 6px 0 6px; font-size: var(--fs-title); line-height: var(--lh-title);
	overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .time{ flex:none; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--fg-caption); }
.srow .fork-mark{ flex:none; width:14px; display:inline-flex; align-items:center; justify-content:center; margin-right:2px; color: var(--fg-caption); }
.srow[data-fresh]{ animation: flash 1.6s var(--ease); }
@keyframes flash{ 0%{ background: var(--accent-tint); } 100%{ background: transparent; } }
/* 就地改名用的输入框：尺寸跟着行里的标题走，换进去时不跳。 */
.rename-input{
	flex:1; min-width:0; margin:0 6px; height:22px; padding:0 6px;
	border:1px solid var(--border-l3); border-radius: var(--r-xs); outline:none;
	background: var(--bg-layer-1); color: var(--fg-primary);
	font-family: var(--sans); font-size: var(--fs-title); line-height: var(--lh-title);
}
.ws-more{
	display:block; width:100%; padding:0 8px 0 30px; height:28px; text-align:left; border-radius: var(--r-sm);
	color: var(--fg-caption); font-size: var(--fs-caption); line-height:28px;
}
.ws-more:hover{ background: var(--bg-hover); color: var(--fg-secondary); }

.side-foot{
	flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--border-l1);
}
.settings-entry{
	flex:1; display:flex; align-items:center; gap:8px; height:32px; padding:0 8px; border-radius: var(--r-md);
	color: var(--fg-tertiary); font-size: var(--fs-title); transition: background .15s var(--ease), color .15s var(--ease);
}
.settings-entry:hover{ background: var(--bg-hover); color: var(--fg-primary); }
.conn{ flex:none; display:inline-flex; align-items:center; gap:6px; padding-right:6px; font-size: var(--fs-caption); color: var(--fg-caption); }
.conn i{ width:6px; height:6px; border-radius:50%; background: rgb(34,197,94); display:block; }

/* ---- 左栏的把手 ---- */
.side-resizer{ flex:none; width:6px; cursor:col-resize; position:relative; z-index:6; }
.side-resizer::after{
	content:""; position:absolute; inset:0 2px; border-radius:2px; background:transparent;
	transition: background .15s var(--ease);
}
.side-resizer:hover::after, .side-resizer.dragging::after{ background: var(--border-l3); }

/* ============================ 会话列 ============================ */
.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; background: var(--bg-base); position:relative; }
/*
 * 会话顶部是**整列的一条固定头**：最上面一行是**会话标题**，右边是「当前分支」这个入口。
 * 它不跟着阅读列的宽度动 —— 正文与输入框仍然居中、宽度归阅读列把手管，而这条头钉在列的左右两端，
 * 所以往右推把手时它纹丝不动（第四、五轮反馈的第一条）。
 * **没有「对话 / 分支」两个页签**（第五轮拆掉）：进门只有「当前分支」这一处，出去只有分支页里那个按钮。
 */
.conv-head{
	flex:none; position:relative; z-index:9; padding:12px 24px 10px;
	background: var(--bg-base); border-bottom:1px solid var(--border-l1);
}
.conv-head-row{ display:flex; align-items:center; gap:12px; }
.conv-head-row .spacer{ flex:1; }
.conv-title{
	min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
	font-size: var(--fs-body); line-height: var(--lh-body); font-weight:600; color: var(--fg-primary);
}

/* 右上角那个入口：写着现在读的是哪一条走法，点它就进分支页。 */
.branch-chip{
	display:inline-flex; align-items:center; gap:8px; max-width:52%; height:28px; padding:0 10px;
	border-radius: var(--r-md); border:1px solid var(--border-l1); background: var(--bg-layer-1);
	color: var(--fg-tertiary); font-size: var(--fs-meta); line-height: var(--lh-meta);
	transition: border-color .15s var(--ease), color .15s var(--ease);
}
.branch-chip:hover{ border-color: var(--border-l3); color: var(--fg-primary); }
.branch-chip .h{ font-family: var(--code); font-size: var(--fs-caption); color: var(--accent); }
.branch-chip .lbl{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--fg-secondary); }

/* 分支页的第二行：选中的是哪一条 + 缩放 + 「回到对话」。它在固定头里，滚图也跑不掉。 */
.branch-tools{
	display:flex; align-items:center; gap:12px; margin-top:10px; padding-top:10px;
	border-top:1px solid var(--border-l1); font-size: var(--fs-caption); color: var(--fg-caption);
}
.branch-tools .spacer{ flex:1; }
.branch-tools b{ font-family: var(--code); font-weight:600; color: var(--fg-secondary); }
.branch-tools em{ font-style:normal; color: var(--fg-tertiary); }
.zoom-group{
	display:flex; align-items:center; gap:2px; padding:2px; border-radius: var(--r-sm);
	background: var(--bg-layer-1); border:1px solid var(--border-l1);
}
.zbtn{
	display:inline-flex; align-items:center; justify-content:center; height:24px; min-width:26px; padding:0 6px;
	border-radius: var(--r-xs); color: var(--fg-tertiary); font-size: var(--fs-meta);
	transition: background .12s var(--ease), color .12s var(--ease);
}
.zbtn:hover{ background: var(--bg-hover); color: var(--fg-primary); }
.zval{ min-width:44px; text-align:center; font-family: var(--code); font-size: var(--fs-caption); color: var(--fg-caption); }
.back-btn{
	display:inline-flex; align-items:center; gap:8px; height:28px; padding:0 12px; border-radius: var(--r-md);
	border:1px solid var(--border-l2); background: var(--bg-layer-1); color: var(--fg-primary);
	font-size: var(--fs-meta); line-height: var(--lh-meta); font-weight:500;
	transition: background .15s var(--ease), border-color .15s var(--ease);
}
.back-btn:hover{ background: var(--bg-layer-2); }
/* 选中了另一条走法时它才是主按钮 —— 那时它的意思从「回去」变成「切过去再回去」。 */
.back-btn.primary{ background: var(--accent); border-color: var(--accent); color: var(--bg-base); }
.back-btn.primary:hover{ filter: brightness(1.08); }
.ws-chip{
	display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 10px; border-radius: var(--r-md);
	border:1px solid var(--border-l2); color: var(--fg-secondary); font-size: var(--fs-meta); max-width:100%;
	transition: background .15s var(--ease), color .15s var(--ease);
}
.ws-chip:hover{ background: var(--bg-hover); color: var(--fg-primary); }
.ws-chip .path{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* 分支页里不留输入框：整块（含工作目录与状态行）一起收掉，会话就全是那棵树。 */
body[data-pane="branch"] .composer-wrap{ display:none; }

.scroll{ flex:1; overflow-y:auto; padding:0 0 24px; }
.reading{ width:100%; max-width: var(--reading-w); margin:0 auto; padding:0 24px; }

/* ==================== 分支视图：一棵从左到右的树，根在最左 ==================== */
/*
 * 第四轮反馈把上一版的"从上到下的泳道图"整个转了九十度：**根在最左，分支往右长**，
 * 泳道变成行、深度变成列。几何和上一版是同构的（一条路走一条泳道、换道处拐一个肘、
 * 主干占最上面那条泳道所以它是一条直线），只是把 x / y 换了个位。
 * 视图本身可以缩放（按钮 / 适应 / Ctrl+滚轮），也可以在空白处拖着平移。
 */
.branch-scroll{ display:flex; flex-direction:column; overflow:hidden; padding:0; }
.branch-sum{
	flex:none; display:flex; align-items:baseline; gap:16px; min-width:0; padding:14px 24px 10px;
	font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--fg-caption);
}
/* 一行放不下就各让各的，别把提示挤到第二行去。 */
.branch-sum > span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.branch-sum b{ font-family: var(--code); font-weight:600; color: var(--fg-secondary); }
/* 操作提示跟在摘要后面：这页的鼠标手势不写出来没人猜得到。 */
.branch-sum .branch-hint{ padding-left:16px; border-left:1px solid var(--border-l1); }
.graph-viewport{ flex:1; min-height:0; overflow:auto; position:relative; cursor:grab; user-select:none; }
.graph-viewport.panning{ cursor:grabbing; }
.graph-sizer{ position:relative; }
.graph-zoom{ position:absolute; left:0; top:0; transform-origin:0 0; }
.graph-svg{ position:absolute; left:0; top:0; pointer-events:none; }
/*
 * 一个节点平时只念一小段（截断），**悬停才把这条走法完整念完** —— 树是拿来看结构的，不是拿来看正文的。
 * 展开长在卡片自己身上（绝对定位，不挤动别的节点），所以它会长高、盖住下面那一行，是故意的。
 */
.gnode{
	position:absolute; display:flex; flex-direction:column; justify-content:center; gap:2px;
	height: var(--node-h);
	padding:5px 10px; border-radius: var(--r-sm); overflow:hidden; text-align:left;
	background: var(--bg-layer-1); border:1px solid var(--border-l2); color: var(--fg-caption);
	font-size: var(--fs-meta); line-height: var(--lh-meta);
	transition: background .12s var(--ease), border-color .12s var(--ease), color .12s var(--ease);
}
.gnode:hover{
	height:auto; min-height: var(--node-h); z-index:3;
	background: var(--bg-layer-2); border-color: var(--border-l3); color: var(--fg-primary);
	box-shadow: 0 10px 26px rgba(0,0,0,.4);
}
html[data-theme="light"] .gnode:hover{ box-shadow: 0 10px 26px rgba(0,0,0,.16); }
.gnode:disabled{ cursor:default; }
.gnode .lbl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gnode .lbl .full{ display:none; }
.gnode:hover .lbl{ overflow:visible; white-space:normal; text-overflow:clip; }
.gnode:hover .lbl .short{ display:none; }
.gnode:hover .lbl .full{ display:inline; }
.gnode .meta{ display:flex; align-items:center; gap:8px; font-family: var(--code); font-size:11px; line-height:16px; color: var(--fg-caption); }
.gnode .meta .tag{ padding:0 5px; border-radius: var(--r-xs); }
.gnode .meta .tag.head{ background: var(--accent-tint); color: var(--accent); }
.gnode[data-on-path]{ color: var(--fg-secondary); }
.gnode[data-current]{ background: var(--bg-layer-2); border-color: var(--border-l3); color: var(--fg-primary); }
.gnode[data-current] .lbl{ font-weight:500; }
.gnode[data-selected]{ border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

/* ---- 阅读列宽度把手 ---- */
.reading-handle{
	position:absolute; top:0; bottom:0; width:16px; z-index:7; cursor:col-resize;
	left: max(4px, calc(50% - var(--reading-w) / 2 - 8px));
}
.reading-handle::after{
	content:""; position:absolute; left:7px; top:0; bottom:0; width:2px; border-radius:2px;
	background:transparent; transition: background .15s var(--ease);
}
.reading-handle:hover::after, .reading-handle.dragging::after{ background: var(--border-l3); }

/* ---- 一轮：没有角色行，也没有圆点，用户消息下面一条分隔线之后就是内容 ---- */
.turn{ position:relative; padding:14px 0; }
.turn.user{ display:flex; justify-content:flex-end; }
.bubble{
	max-width:min(76%, 560px); padding:9px 14px; border-radius: var(--r-lg);
	background: var(--bubble); color: var(--fg-primary); font-size: var(--fs-body); line-height: var(--lh-body);
	white-space:pre-wrap;
}
.turn-divider{ height:1px; background: var(--border-l1); margin:4px 0 2px; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

.prose{ font-size: var(--fs-body); line-height: var(--lh-body); }
.prose > :first-child{ margin-top:0; }
.prose > :last-child{ margin-bottom:0; }
.prose p{ margin:0 0 10px; }
.prose h3{ margin:16px 0 8px; font-size: calc(var(--fs-body) + 2px); line-height: var(--lh-body); font-weight:600; }
.prose ul{ margin:0 0 10px; padding-left:22px; }
.prose li{ margin:3px 0; }
.prose code{ font-family: var(--code); font-size: var(--fs-code); background: var(--code-bg);
	padding:1px 5px; border-radius: var(--r-xs); }
.prose pre{ margin:0 0 10px; padding:12px 14px; border-radius: var(--r-md); background: var(--code-bg);
	border:1px solid var(--border-l1); overflow-x:auto; }
.prose pre code{ background:none; padding:0; font-size: var(--fs-code); line-height: var(--lh-code); }

/* ---- 思考行 ---- */
.reasoning{ margin:0 0 6px; }
.reasoning summary{
	display:flex; align-items:center; gap:8px; height:26px; list-style:none; cursor:pointer;
	color: var(--fg-tertiary); font-size: var(--fs-meta); line-height: var(--lh-meta);
	transition: color .15s var(--ease);
}
.reasoning summary::-webkit-details-marker{ display:none; }
.reasoning summary:hover{ color: var(--fg-secondary); }
.reasoning .prev{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--fg-caption); }
.reasoning[open] summary .prev{ display:none; }
.reasoning .rbody{
	margin:6px 0 10px; padding:10px 14px; border-left:2px solid var(--border-l2);
	color: var(--fg-tertiary); font-size: var(--fs-meta); line-height: var(--lh-meta); white-space:pre-wrap;
}
.reasoning[data-running] summary .label{ color: var(--warn); }

/* ---- 工具行：一行 Name + path，点开才展开 ---- */
.tools{ margin:2px 0 10px; display:flex; flex-direction:column; }
.tool{ border:0; }
.tool summary{
	display:flex; align-items:center; gap:9px; min-height:28px; list-style:none; cursor:pointer;
	font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--fg-tertiary);
	transition: color .12s var(--ease);
}
.tool summary::-webkit-details-marker{ display:none; }
.tool summary:hover{ color: var(--fg-primary); }
.tool .chev{ flex:none; width:12px; height:12px; color: var(--fg-caption); opacity:0; transition: opacity .12s var(--ease), transform .12s var(--ease); }
.tool summary:hover .chev, .tool[open] .chev{ opacity:1; }
.tool[open] .chev{ transform: rotate(90deg); }
.tool .name{ flex:none; font-weight:500; color: var(--fg-secondary); }
.tool summary:hover .name{ color: var(--fg-primary); }
.tool .path{ flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
	font-family: var(--code); font-size: var(--fs-caption); color: var(--fg-caption); }
.tool .stat{ flex:none; margin-left:auto; font-family: var(--code); font-size: var(--fs-caption); }
.tool .stat .add{ color: rgb(78,209,126); }
.tool .stat .del{ color: rgb(242,90,90); margin-left:6px; }
.tool .spin{ flex:none; width:8px; height:8px; border-radius:50%; background: var(--warn); animation: pulse 1.4s infinite var(--ease); }
.tool[data-error] .name{ color: rgb(242,90,90); }
.tool .out{
	margin:4px 0 8px 21px; padding:10px 12px; border-radius: var(--r-md); background: var(--code-bg);
	border:1px solid var(--border-l1); font-family: var(--code); font-size: var(--fs-code);
	line-height: var(--lh-code); color: var(--fg-secondary); white-space:pre-wrap; overflow-x:auto; max-height:260px;
}

/* ---- 输入框 ---- */
.composer-wrap{ flex:none; position:relative; z-index:9; padding:0 0 10px; }
/* 工作目录在输入框顶部的最左边（原来摆在会话左上角，那不是它的位置）。 */

}
.composer textarea::placeholder{ color: var(--fg-caption); }
.composer-foot{ display:flex; align-items:center; gap:10px; padding:4px 10px 10px 16px; }
.composer-foot .spacer{ flex:1; }
.model-pick{
	display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 10px; border-radius: var(--r-md);
	color: var(--fg-secondary); font-size: var(--fs-meta);

.model-pick:hover{ background: var(--bg-hover); color: var(--fg-primary); }
.model-pick .level{ font-family: var(--code); font-size: var(--fs-caption); color: var(--fg-caption); }
.send{
	display:inline-flex; align-items:center; justify-content:center; gap:6px; height:30px; padding:0 14px;
	border-radius: var(--r-md); background: var(--fg-primary); color: var(--bg-base);
	font-size: var(--fs-title); font-weight:500;
}
.send.off{ background: var(--bg-layer-2); color: var(--fg-caption); }
html[data-theme="light"] .send{ color:#fff; background: rgb(15,17,21); }
html[data-theme="light"] .send.off{ background: rgb(235,238,242); color: var(--fg-caption); }

.statusbar{
	display:flex; align-items:center; gap:20px; padding:8px 8px 0;

}

/* ---- 两个把手 ---- */
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
/** 边界可以写死一个数，也可以给个函数（正文列那条上限跟着列宽走）。 */
function bound(v) { return typeof v === "function" ? v() : v; }

function makeResizer(el, opts) {
	el.addEventListener("pointerdown", function (event) {
		event.preventDefault();
		el.setPointerCapture(event.pointerId);
		el.classList.add("dragging");
		const startX = event.clientX;
		const start = opts.read();
		const move = function (e) {
			opts.write(clamp(start + (e.clientX - startX) * (opts.scale || 1), bound(opts.lo), bound(opts.hi)));
		};
		const up = function () {
			el.classList.remove("dragging");
			el.removeEventListener("pointermove", move);
			el.removeEventListener("pointerup", up);
		};
		el.addEventListener("pointermove", move);
		el.addEventListener("pointerup", up);
	});

	el.addEventListener("keydown", function (event) {
		const step = event.shiftKey ? 24 : 8;
		if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
		event.preventDefault();
		const delta = event.key === "ArrowRight" ? step : -step;
		opts.write(clamp(opts.read() + delta * (opts.scale || 1), bound(opts.lo), bound(opts.hi)));
	});

	el.tabIndex = 0;
}

const root = document.documentElement;
function getVar(name) { return parseInt(getComputedStyle(root).getPropertyValue(name), 10) || 0; }

makeResizer(document.getElementById("side-resizer"), {

	// 左栏一变，会话列就跟着变，所以正文宽度（两侧留白那条规则）要当场重算一遍。
	write: function (v) {

});
/*
 * 正文（阅读列）的宽度尺度 —— 第六轮定：
 * **默认两侧各留 35px**（原来在 1440 的窗口里是 70px，正好砍掉一半），而"两侧"是跟着**会话列宽**
 * 算的，所以窗口拉大拉小、左栏拉宽拉窄，那两条缝都还是同一小条，不会变成两条大沟。
 * 拖到最宽时两侧各留 20px；再宽也不超过 1280px —— 一行字几千像素就没法读了。
 * 参考实现是 `clamp(680, 列宽*0.64, 920)` + 两侧各 88px 的留白预算，这里按用户的要求把留白砍半。
 */
const READING_MIN = 600;
const READING_EDGE_DEFAULT = 70;   // 默认两侧一共留这么多（各 35）
const READING_EDGE_MIN = 40;       // 拖到最宽时两侧一共留这么多（各 20）
const READING_MAX = 1280;
let readingPinned = false;         // 用户自己拖过之后就不再跟着窗口走了

function columnWidth() {
	return document.getElementById("main-col").clientWidth;
}
function autoReadingWidth() {
	return clamp(Math.min(columnWidth() - READING_EDGE_DEFAULT, READING_MAX), READING_MIN, READING_MAX);
}
function maxReadingWidth() {
	return clamp(Math.min(columnWidth() - READING_EDGE_MIN, READING_MAX), READING_MIN, READING_MAX);
}
/** 窗口一变就把正文宽度重新夹一次：没拖过就继续跟着走，拖过就尊重用户那个数。 */
function fitReadingWidth() {
	const want = readingPinned ? getVar("--reading-w") : autoReadingWidth();
	root.style.setProperty("--reading-w", clamp(want, READING_MIN, maxReadingWidth()) + "px");
}

makeResizer(document.getElementById("reading-handle"), {
	// scale 取 -2：阅读列是居中的，所以抓住左缘往右推 = 变窄。乘 2 是为了让把手跟住指针。
	lo: READING_MIN, hi: maxReadingWidth, scale: -2,
	read: function () { return getVar("--reading-w"); },
	write: function (v) { readingPinned = true; root.style.setProperty("--reading-w", v + "px"); },
});

/* ---- 自绘右键菜单 ---- */
function openMenu(menu, x, y) {
	menu.hidden = false;
	const rect = menu.getBoundingClientRect();
	menu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + "px";
	menu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + "px";
}

function closeMenus() {
	for (const m of document.querySelectorAll(".menu")) m.hidden = true;
	for (const r of document.querySelectorAll('.srow[data-menu-open]')) r.removeAttribute("data-menu-open");
}

window.addEventListener("pointerdown", function (event) {
	if (event.target.closest(".menu")) return;
	closeMenus();
});
window.addEventListener("keydown", function (event) { if (event.key === "Escape") closeMenus(); });
window.addEventListener("blur", closeMenus);

const sessionMenu = document.getElementById("session-menu");
let menuTarget = null;

sideList.addEventListener("contextmenu", function (event) {
	const row = event.target.closest(".srow");
	if (!row) return;
	event.preventDefault();
	closeMenus();
	menuTarget = row;
	document.getElementById("session-menu-head").textContent = row.dataset.title;
	openMenu(sessionMenu, event.clientX, event.clientY);
});

sessionMenu.addEventListener("click", function (event) {
	const item = event.target.closest(".menu-item");
	if (!item || menuTarget === null) return;
	const target = menuTarget;
	closeMenus();
	if (item.dataset.act === "fork") forkRow(target);
	else if (item.dataset.act === "rename") startRename(target);
});

/**
 * 派生新会话。
 *
 * 名字由客户端算（01 拍的五条之二）：剥掉源名字末尾已有的「（N）」，在同一个工作区里找同族里
 * 最大的 N，写成「（N+1）」。**行本身跟普通会话长得一模一样**，只是紧跟在源会话下面 ——
 * 位置就是"它是从哪儿来的"，不需要缩进，也不需要标记。
 */
function forkRow(source) {
	const base = baseNameOf(source.dataset.title);
	const group = source.closest(".ws");
	let max = 0;
	const re = new RegExp("^" + escapeRe(base) + "（(\\d+)）$");
	for (const row of group.querySelectorAll(".srow")) {
		const m = row.dataset.title.match(re);
		if (m) max = Math.max(max, Number(m[1]));
	}
	const suffix = "（" + (max + 1) + "）";
	const node = document.createElement("div");
	node.innerHTML = rowHTML({ title: base + suffix, suffix: suffix, time: "刚刚", current: true, fresh: true });
	const row = node.firstElementChild;
	for (const other of sideList.querySelectorAll('.srow[aria-current="true"]')) other.removeAttribute("aria-current");
	source.after(row);
	row.scrollIntoView({ block: "nearest" });
	placeCallouts();
}

/** 名字里那个「（N）」后缀是显示层的事，改名时要先把它摘下来。 */
function baseNameOf(title) {
	return title.replace(/（\d+）$/, "");
}

function escapeRe(value) {
	return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

/**
 * 就地改名。
 *
 * 编辑的是**去掉后缀的那个名字**，后缀本身是派生的事实（它是谁的 fork），不该被用户敲进去，
 * 所以提交的时候再拼回来。
 */
function startRename(row) {
	const span = row.querySelector(".title");
	if (span === null || row.querySelector(".rename-input") !== null) return;
	const original = row.dataset.title;
	const suffix = row.dataset.suffix || "";

	const input = document.createElement("input");
	input.className = "rename-input";
	input.value = baseNameOf(original);
	span.replaceWith(input);
	input.focus();
	input.select();

	let settled = false;
	const finish = (save) => {
		if (settled) return;
		settled = true;
		const typed = input.value.trim();
		const base = save && typed.length > 0 ? typed : baseNameOf(original);
		const next = base + suffix;
		row.dataset.title = next;
		row.title = next;
		const back = document.createElement("span");
		back.className = "title";
		back.textContent = next;
		input.replaceWith(back);
	};
	input.addEventListener("keydown", (event) => {
		if (event.key === "Enter") { event.preventDefault(); finish(true); }
		else if (event.key === "Escape") { event.preventDefault(); finish(false); }
	});
	input.addEventListener("blur", () => finish(true));
}

/* ---- 会话里的右键：从此分支 ---- */
/*
 * 分支视图：一棵**从左到右**的树，根在最左边那一列（第四轮反馈把它整个转了九十度）。
 *
 * 一个分支点就是"某一条消息之后有几条走法"，所以它本来就是一棵树。上一版是 git 那样从上往下
 * 铺泳道，现在方向反了过来：**列 = 深度（往右长），行 = 泳道**。几何与上一版同构，只是 x / y
 * 换了位 —— 一条路走一行、换行处拐一个肘、**主干占最上面那一行所以它是一条水平直线**；
 * 每个分支点上，在主干上的那个孩子接着父行，其余各开一行新的；行序仍然是深度优先
 * （一棵子树画完才轮到它下面的兄弟）。
 *
 * 视图可以缩放（`−` / `＋` / `适应` / Ctrl+滚轮），空白处可以拖着平移；点一个节点只是**选中**它，
 * 要按固定头里那个按钮才真的切过去并回到对话 —— 上一版"点一下就走"也被第四轮推翻了。
 *
 * 真实现里这棵树的每一层来自 `item.branch.options`（`BranchOption[]`），"沿哪条路"由会话的
 * leaf 决定 —— 这里用 BRANCH_TREE + currentVariant 把同一件事摊平。
 */
const NODE_W = 268;   // 一个节点卡的宽
const NODE_H = 46;    // 一个节点卡的高：摘要一行 + 元信息一行
const STEP_X = 300;   // 深一层往右多走多少
const LANE_H = 58;    // 一条泳道（一行）多高
const DOT_R = 4.5;    // 线上的圆点
const DOT_X = 12;     // 圆点离节点卡左缘多远
const NODE_X = 28;    // 节点卡离自己那个圆点多远
const PAD_X = 24;     // 图外面留的边（也是视口的左边距）
const PAD_Y = 16;
const ZOOM_MIN = 0.4;
const ZOOM_MAX = 3;
const LANE_COLORS = ["rgb(122,170,255)", "rgb(78,209,126)", "rgb(226,150,88)", "rgb(198,120,221)"];

let zoom = 1;
let selected = currentVariant;   // 分支页里选中的那一条（还没应用），一开始就是现在读的这条
let laid = null;                 // 最近一次布局，缩放要用

/** 一个短 id 而已：真实现里它就是 entry id 的前几位。 */
function hashOf(id) {
	let h = 2166136261;
	for (let i = 0; i < id.length; i++) {
		h ^= id.charCodeAt(i);
		h = Math.imul(h, 16777619);
	}
	return (h >>> 0).toString(16).padStart(8, "0").slice(0, 7);
}

/** 从根到当前走法的那条链 —— 图里哪几个点该画成实心。 */
function branchPath() {
	const path = [];
	const walk = (nodes, chain) => {
		for (const node of nodes) {
			const next = chain.concat(node.id);
			if (node.id === currentVariant) { path.push(...next); return true; }
			if (node.children !== undefined && walk(node.children, next)) return true;
		}
		return false;
	};
	walk(BRANCH_TREE, []);
	return path;
}

function countBranch(nodes) {
	let points = 0;
	let options = 0;
	for (const node of nodes) {
		if (node.children !== undefined && node.children.length > 1) {
			points += 1;
			options += node.children.length;
		}
		if (node.children !== undefined) {
			const sub = countBranch(node.children);
			points += sub.points;
			options += sub.options;
		}
	}
	return { points: points, options: options };
}

/** 节点上只留一小段：真句子取前十几个字，剩下的等鼠标停上去再看。 */
function shorten(text, max) {
	return text.length <= max ? text : text.slice(0, max) + "…";
}

/** 树里找一个节点，连它的 label、轮次一起拿回来。 */
function findNode(id) {
	const walk = (nodes) => {
		for (const node of nodes) {
			if (node.id === id) return node;
			if (node.children !== undefined) {
				const hit = walk(node.children);
				if (hit !== null) return hit;
			}
		}
		return null;
	};
	return walk(BRANCH_TREE);
}

/**
 * 排位置：**列由深度决定**（往右长），**行由泳道决定**。
 * 规则只有一条 —— 在主干上的那个孩子接着父行，其余各占一行新的，于是你现在读的那条路
 * 永远是最上面那一行，从头到尾是一条水平直线。
 */
function layoutGraph() {
	const path = branchPath();
	const nodes = [];
	let nextLane = 0;
	const walk = (node, depth, lane) => {
		nodes.push({ node: node, depth: depth, lane: lane });
		const kids = (node.children || []).slice();
		kids.sort((a, b) => (path.indexOf(b.id) >= 0 ? 1 : 0) - (path.indexOf(a.id) >= 0 ? 1 : 0));
		kids.forEach((kid, i) => walk(kid, depth + 1, i === 0 ? lane : ++nextLane));
	};
	walk(BRANCH_TREE[0], 0, 0);
	const lanes = Math.max.apply(null, nodes.map((r) => r.lane)) + 1;
	const depths = Math.max.apply(null, nodes.map((r) => r.depth)) + 1;
	return {
		nodes: nodes, path: path, lanes: lanes, depths: depths,
		width: (depths - 1) * STEP_X + NODE_X + NODE_W,
		height: lanes * LANE_H,
	};
}

/** 一个节点卡：左缘往右看，先是线上的那个圆点，再是卡片本身。 */
const dotXOf = (depth) => depth * STEP_X + DOT_X;
const dotYOf = (lane) => lane * LANE_H + LANE_H / 2;

function paintGraph() {
	laid = layoutGraph();
	const graphHead = laid.path;
	const stats = countBranch(BRANCH_TREE);
	const at = new Map(laid.nodes.map((row, i) => [row.node.id, i]));

	// 连线：从父节点的圆点往右走；要换行的，先直着一小段，再在两根泳道之间拐一个肘。
	let paths = "";
	const draw = (node) => {
		const a = at.get(node.id);
		(node.children || []).forEach((kid, i) => {
			const b = at.get(kid.id);
			const ax = dotXOf(laid.nodes[a].depth) + DOT_R;
			const ay = dotYOf(laid.nodes[a].lane);
			const bx = dotXOf(laid.nodes[b].depth) - DOT_R;
			const by = dotYOf(laid.nodes[b].lane);
			const color = LANE_COLORS[laid.nodes[b].lane % LANE_COLORS.length];
			const opacity = graphHead.indexOf(kid.id) >= 0 ? 1 : 0.4;
			let d;
			if (ay === by) {
				d = "M" + ax + "," + ay + " H" + bx;
			} else {
				const out = ax + 10 + i * 9;
				const mid = out + 16;
				const sign = by > ay ? 1 : -1;
				d = "M" + ax + "," + ay + " H" + out +
					" Q" + mid + "," + ay + " " + mid + "," + (ay + sign * 10) +
					" V" + (by - sign * 10) +
					" Q" + mid + "," + by + " " + (mid + 10) + "," + by +
					" H" + bx;
			}
			paths += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-opacity="' + opacity + '"/>';
			draw(kid);
		});
	};
	draw(BRANCH_TREE[0]);

	let dots = "";
	let cards = "";
	laid.nodes.forEach((row) => {
		const id = row.node.id;
		const onPath = graphHead.indexOf(id) >= 0;
		const on = id === currentVariant;
		const sel = id === selected;
		const color = LANE_COLORS[row.lane % LANE_COLORS.length];
		dots += '<circle cx="' + dotXOf(row.depth) + '" cy="' + dotYOf(row.lane) + '" r="' + (sel ? DOT_R + 1.5 : DOT_R) +
			'" fill="' + (onPath ? color : "none") + '" stroke="' + color + '" stroke-width="1.8" stroke-opacity="' +
			(onPath ? 1 : 0.6) + '"/>';
		cards += '<button class="gnode" data-id="' + id + '"' +
			(on ? " data-current" : "") + (sel ? " data-selected" : "") + (onPath ? " data-on-path" : "") +
			(VARIANTS[id] === undefined ? " disabled" : "") +
			// 高度走 --node-h：悬停时 CSS 要能把它改成 auto 好把整句话展开。
			' style="left:' + row.depth * STEP_X + "px;top:" + (dotYOf(row.lane) - NODE_H / 2) + "px;width:" +
			NODE_W + "px;--node-h:" + NODE_H + 'px" title="' + esc(row.node.label) + '">' +
			// 平时只念一小段（短的那半件由 CSS 在悬停时换成整句），完整的那句塞在 title 里兜底。
			'<span class="lbl"><span class="short">' + esc(shorten(row.node.label, 14)) +
			'</span><span class="full">' + esc(row.node.label) + "</span></span>" +
			'<span class="meta"><span>' + hashOf(id) + "</span>" +
			(row.node.turn === undefined ? "" : "<span>轮 " + row.node.turn + "</span>") +
			(on ? '<span class="tag head">当前</span>' : sel ? '<span class="tag head">已选中</span>' : "") +
			"</span></button>";
	});

	document.getElementById("branch-sum").innerHTML =
		'<span>这份记录有 <b>' + stats.points + "</b> 个分支点、<b>" + stats.options + "</b> 条走法；" +
		"根在最左边，实心点连起来的那条是你现在读的。</span>" +
		'<span class="branch-hint">左键点一个节点选中它 · 悬停看整句话 · 按住左键拖动画布 · Ctrl+滚轮放大</span>';

	const zoomEl = document.getElementById("graph-zoom");
	zoomEl.style.width = laid.width + "px";
	zoomEl.style.height = laid.height + "px";
	zoomEl.innerHTML =
		'<svg class="graph-svg" width="' + laid.width + '" height="' + laid.height + '">' + paths + dots + "</svg>" + cards;

	applyZoom(zoom);
	updateHeader();
}

/**
 * 固定头里那两处随会话变的字：对话页的「当前分支」抬头、分支页的「选中了哪一条」。
 * 抬头永远在，所以切走切回、缩放到哪儿都知道自己读的是哪条路。
 */
function updateHeader() {
	const stats = countBranch(BRANCH_TREE);
	// 最上面那一行是会话标题（真实现里就是服务端派生出来的那个标题）。
	document.getElementById("conv-title").textContent = SESSION_TITLE;
	const chip = document.getElementById("branch-chip");
	// 只有一条走法的时候「分支」这件事没有意义，这个入口一起收掉（09 号）。
	chip.hidden = stats.options < 2;
	const here = findNode(currentVariant);
	if (here !== null) {
		chip.innerHTML = ICONS.branch +
			"<span>当前分支</span>" +
			'<span class="h">' + hashOf(currentVariant) + "</span>" +
			'<span class="lbl">' + esc(here.label) + "</span>";
	}

	const sel = findNode(selected);
	const info = document.getElementById("sel-info");
	const back = document.getElementById("back-to-chat");
	const move = sel !== null && sel.id !== currentVariant;
	if (sel === null) {
		info.innerHTML = "点一个节点选中它，再按右边的按钮回到对话。";
	} else if (!move) {
		info.innerHTML = "现在读的是 <b>" + hashOf(sel.id) + "</b> <em>" + esc(sel.label) + "</em>（轮 " + sel.turn + "）";
	} else {
		info.innerHTML = "已选中 <b>" + hashOf(sel.id) + "</b> <em>" + esc(sel.label) + "</em>（轮 " + sel.turn + "）";
	}
	back.classList.toggle("primary", move);
	back.textContent = move ? "切到这一条并回到对话" : "回到对话";
}

/* ---- 缩放与平移：图是活的，按钮、适应、Ctrl+滚轮都行 ---- */
/**
 * 缩放，并把指针（不给就用视口中心）指着的那一点钉在原地。
 * 图的自然尺寸与缩放后的尺寸是两回事，所以外面那个 sizer 撑出真正的滚动范围。
 */
function applyZoom(z, cx, cy) {
	if (laid === null) return;
	const viewport = document.getElementById("graph-viewport");
	const sizer = document.getElementById("graph-sizer");
	const zoomEl = document.getElementById("graph-zoom");
	const box = viewport.getBoundingClientRect();
	const vx = cx === undefined ? viewport.clientWidth / 2 : cx - box.left;
	const vy = cy === undefined ? viewport.clientHeight / 2 : cy - box.top;
	const gx = (viewport.scrollLeft + vx - PAD_X) / zoom;
	const gy = (viewport.scrollTop + vy - PAD_Y) / zoom;

	zoom = clamp(z, ZOOM_MIN, ZOOM_MAX);
	sizer.style.width = laid.width * zoom + PAD_X * 2 + "px";
	sizer.style.height = laid.height * zoom + PAD_Y * 2 + "px";
	zoomEl.style.left = PAD_X + "px";
	zoomEl.style.top = PAD_Y + "px";
	zoomEl.style.transform = "scale(" + zoom + ")";

	viewport.scrollLeft = gx * zoom + PAD_X - vx;
	viewport.scrollTop = gy * zoom + PAD_Y - vy;
	document.getElementById("zoom-val").textContent = Math.round(zoom * 100) + "%";
}

/** 装得下的话需要缩到多少倍：宽和高都要装下。 */
function fitScale() {
	if (laid === null) return 1;
	const viewport = document.getElementById("graph-viewport");
	const byW = (viewport.clientWidth - PAD_X * 2) / laid.width;
	const byH = (viewport.clientHeight - PAD_Y * 2) / laid.height;
	return Math.min(byW, byH);
}

function scrollHome() {
	const viewport = document.getElementById("graph-viewport");
	viewport.scrollLeft = 0;
	viewport.scrollTop = 0;
}

/** 「适应」：缩放到刚好装下，然后回到左上角。 */
function fitZoom() {
	applyZoom(fitScale());
	scrollHome();
}

/** 进分支页时的默认：装得下就 100%，装不下才缩 —— 一打开就得看见整棵树。 */
function homeZoom() {
	applyZoom(Math.min(1, fitScale()));
	scrollHome();
}

function setPane(next) {
	pane = next;
	// 分支页里不留输入框，这条挂在 body 上让 CSS 一次收掉整块。
	body.dataset.pane = next;
	document.getElementById("scroll").hidden = next !== "chat";
	document.getElementById("branch-scroll").hidden = next !== "branch";
	document.getElementById("branch-tools").hidden = next !== "branch";
	if (next === "branch") { paintGraph(); homeZoom(); }
	updateHeader();
	placeCallouts();
}

/**
 * 应用选中的那一条 —— 第四轮定的流程：在分支页里**只是选中**（不马上切），
 * 按那个按钮才真的换记录、并回到对话；对话页的抬头立刻写着现在读的是哪一条。
 */
function applySelection() {
	if (selected !== null && selected !== currentVariant) setVariant(selected);
	setPane("chat");
}

function setVariant(id) {
	if (VARIANTS[id] === undefined) return;
	currentVariant = id;
	selected = id;
	renderReading();
	paintGraph();
	updateHeader();
	placeCallouts();
	document.getElementById("branch-scroll").scrollTop = 0;
}

/* 进门只有这一处：固定头右上角的「当前分支」。 */
document.getElementById("branch-chip").addEventListener("click", () => {
	if (pane !== "branch") setPane("branch");
});
document.getElementById("back-to-chat").addEventListener("click", applySelection);
document.getElementById("zoom-in").addEventListener("click", () => applyZoom(zoom * 1.2));
document.getElementById("zoom-out").addEventListener("click", () => applyZoom(zoom / 1.2));
document.getElementById("zoom-fit").addEventListener("click", fitZoom);

/** 选中一条走法 —— 只是选中，不切过去（切过去是那个按钮的事）。 */
function selectNode(id) {
	if (VARIANTS[id] === undefined || id === selected) return;
	selected = id;
	paintGraph();
}

/*
 * 鼠标：**按住左键拖动画布**（哪儿都行，压在节点上也一样），**松开时没拖过才算"点了一下"**。
 * 所以这里自己算 pointer，不借 click —— 否则一拖就会顺手选中一个节点。
 */
const viewport = document.getElementById("graph-viewport");
let drag = null;
let dragged = false;

viewport.addEventListener("pointerdown", (event) => {
	if (event.button !== 0) return;
	drag = { x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
	dragged = false;
});
viewport.addEventListener("pointermove", (event) => {
	if (drag === null) return;
	const dx = event.clientX - drag.x;
	const dy = event.clientY - drag.y;
	// 4px 以内还当它是"点"；超过了才接管成拖动，并把指针捕获过来。
	if (!dragged && Math.abs(dx) + Math.abs(dy) < 4) return;
	if (!dragged) {
		dragged = true;
		viewport.classList.add("panning");
		viewport.setPointerCapture(event.pointerId);
	}
	viewport.scrollLeft = drag.left - dx;
	viewport.scrollTop = drag.top - dy;
});
window.addEventListener("pointerup", (event) => {
	if (drag === null) return;
	const wasDrag = dragged;
	drag = null;
	dragged = false;
	viewport.classList.remove("panning");
	if (wasDrag) return;   // 那一下是拖画面，不算点
	const card = event.target.closest(".gnode");
	if (card !== null && !card.disabled) selectNode(card.dataset.id);
});
window.addEventListener("pointercancel", () => {
	drag = null;
	dragged = false;
	viewport.classList.remove("panning");
});

/* Ctrl / ⌘ + 滚轮缩放（指针指着的那一点钉住），普通滚轮还是滚动。 */
viewport.addEventListener("wheel", (event) => {
	if (!event.ctrlKey && !event.metaKey) return;
	event.preventDefault();
	applyZoom(zoom * (event.deltaY < 0 ? 1.12 : 1 / 1.12), event.clientX, event.clientY);
}, { passive: false });

/* 连点两下 = 「就它了」：选中并直接带着它回到对话。 */
viewport.addEventListener("dblclick", (event) => {
	const card = event.target.closest(".gnode");
	if (card === null || card.disabled) return;
	selectNode(card.dataset.id);
	applySelection();
});

const msgMenu = document.getElementById("msg-menu");
let msgTarget = null;

document.getElementById("scroll").addEventListener("contextmenu", function (event) {
	const turn = event.target.closest(".turn.user");
	if (!turn) return;
	event.preventDefault();
	closeMenus();
	msgTarget = turn;
	openMenu(msgMenu, event.clientX, event.clientY);
});

msgMenu.addEventListener("click", function (event) {
	const item = event.target.closest(".menu-item");
	if (!item) return;
	closeMenus();
	// 分支的入口在这里；选完之后左栏一个字节都不变，变的是会话顶部多出来的那个「分支」页签。
	if (item.dataset.act === "branch") setPane("branch");
});

/* ---- 输入框：有字才能发 ---- */
const textarea = document.querySelector(".composer textarea");
const send = document.querySelector(".send");
textarea.addEventListener("input", function () {
	const has = textarea.value.trim().length > 0;
	send.classList.toggle("off", !has);
	textarea.style.height = "auto";
	textarea.style.height = Math.min(180, textarea.scrollHeight) + "px";
});

/* ---- 标注气泡：按被标注元素的实测位置摆，不靠猜像素 ---- */
/*
 * 每条标注 = 第几个、锚在哪个元素上（选择器 + 第几个匹配）、贴哪一边、再偏移多少。
 * 位置在渲染之后实测，所以改了字号或拖了把手它自己会跟上，不用手工对像素。
 */
const ANNOTS = {
	side: [
		["1", ".side-top", 0, "left", 0, 6],
		["2", ".srow", 0, "right", 0, 6],
		["3", ".srow", 1, "right", 0, 6],
		["4", ".srow", 0, "right", 0, 38],
		["5", ".side-col", 0, "right", 0, null],
	],
	conv: [
		["1", ".conv-head", 0, "left", -14, 6],        // 顶部是整列的固定头
		["2", ".branch-chip", 0, "left", -26, 2],      // 对话页里的「当前分支」抬头
		["3", ".turn-divider", 0, "gutter", 0, -7],
		["4", ".tool", 0, "gutter", 0, 4],
		["5", ".prose", 0, "gutter", 0, 2],
		["6", ".composer-head", 0, "gutter", -8, 4],
		["7", ".composer", 0, "gutter-r", -6, 12],
	],
	branch: [
		["1", ".conv-head", 0, "left", -14, 6],        // 固定头：选中项 + 缩放 + 回到对话（这页没有输入框）
		["2", ".graph-viewport", 0, "left", -14, 0],   // 树是横着长的，根在最左
		["3", ".gnode[data-id=v0b]", 0, "left", -22, 0], // 停下鼠标看它展开；点一下是选中
		["4", ".zoom-group", 0, "left", -26, 2],       // Ctrl+滚轮也能缩放
		["5", ".back-btn", 0, "right", -20, 40],
		["6", ".graph-viewport", 0, "right", -20, null],  // 按住左键拖动画布
	],
};

/** 这一屏该贴哪一套标注：分支页贴分支那套，左栏只在整窗 / 左栏这两屏贴。 */
function annotSet() {
	if (body.dataset.view === "branch") return [["#sidebar", []], [".main-col", ANNOTS.branch]];
	if (body.dataset.view === "sidebar") return [["#sidebar", ANNOTS.side], [".main-col", []]];
	if (body.dataset.view === "conv") return [["#sidebar", []], [".main-col", pane === "branch" ? ANNOTS.branch : ANNOTS.conv]];
	return [["#sidebar", ANNOTS.side], [".main-col", pane === "branch" ? ANNOTS.branch : ANNOTS.conv]];
}

function placeCallouts() {
	// 先把两列的旧气泡都清掉，再只画当前这一屏该显的那一套。
	for (const col of document.querySelectorAll("#sidebar, .main-col")) {
		for (const old of col.querySelectorAll(".callout")) old.remove();
	}
	for (const [column, list] of annotSet()) {
		const col = document.querySelector(column);
		if (!col) continue;
		const colRect = col.getBoundingClientRect();
		// 阅读列两侧的那条缝：标注贴在那里，不压着正文。
		const gutter = Math.max(4, (colRect.width - getVar("--reading-w")) / 2);
		for (const [n, sel, index, edge, dx, dy] of list) {
			const anchor = col.querySelectorAll(sel)[index];
			if (!anchor) continue;
			const box = anchor.getBoundingClientRect();
			let left;
			if (edge === "left") left = box.left - colRect.left + dx;
			else if (edge === "right") left = colRect.width - 26 + dx;
			else if (edge === "gutter-r") left = colRect.width - gutter - 26 + dx;
			else left = gutter - 26 + dx;
			const top = dy === null ? colRect.height / 2 - 10 : box.top - colRect.top + dy;
			const badge = document.createElement("span");
			badge.className = "callout";
			badge.textContent = n;
			badge.style.left = left + "px";
			badge.style.top = top + "px";
			col.append(badge);
		}
	}
}

window.addEventListener("resize", () => {
	fitReadingWidth();
	placeCallouts();
});

/* ---- 启动 ---- */
body.dataset.pane = pane;   // 一开始是对话页（分支页要收掉输入框，那条 CSS 认这个属性）
renderSidebar();
renderReading();
renderLegend();
paintGraph();
fitReadingWidth();
placeCallouts();
</script>
</body>
